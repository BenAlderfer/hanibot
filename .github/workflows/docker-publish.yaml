name: Publish Docker image

# Builds the bot image and pushes it to GitHub Container Registry (GHCR).
# master -> :staging; a pushed semver tag (e.g. 1.2.3) -> :production (plus the tag name).
# The NAS runs Watchtower, which pulls the new image for each tag and restarts the matching bot.

on:
  push:
    branches: [master]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Only publish an image if the tests pass for this commit.
  test:
    uses: ./.github/workflows/config.yaml

  publish:
    needs: test
    # Manual runs from other branches would produce no image tags.
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Production releases must come from a commit that is on master.
      - name: Require tagged commit to be on master
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases the image name (GHCR requires it; the repo owner has capitals).
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=staging-,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=production,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag

      - uses: docker/build-push-action@v7
        with:
          context: .
          # Covers both x86 and ARM NAS models.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
